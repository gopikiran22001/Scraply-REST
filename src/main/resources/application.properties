# ==========================================
# Server
# ==========================================

server.port=8080
server.address=0.0.0.0


# ==========================================
# Spring Application
# ==========================================

spring.application.name=Scraply
spring.config.import=optional:file:.env[.properties]

# ==========================================
# Logging
# ==========================================
logging.level.com.scraply=INFO


# ==========================================
# PostgreSQL Datasource
# ==========================================

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.password=${DB_PASSWORD}


# ==========================================
# JPA / Hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# ==========================================
# MongoDB
# ==========================================

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE}
spring.data.mongodb.auto-index-creation=true

# ==========================================
# RedisQueue
# ==========================================

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# ==========================================
# Redis sliding-window rate limiting
# ==========================================

scraply.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
scraply.rate-limit.login.limit=${RATE_LIMIT_LOGIN_LIMIT:5}
scraply.rate-limit.login.window=${RATE_LIMIT_LOGIN_WINDOW:60s}
scraply.rate-limit.register.limit=${RATE_LIMIT_REGISTER_LIMIT:3}
scraply.rate-limit.register.window=${RATE_LIMIT_REGISTER_WINDOW:1h}
scraply.rate-limit.authenticated.limit=${RATE_LIMIT_API_LIMIT:100}
scraply.rate-limit.authenticated.window=${RATE_LIMIT_API_WINDOW:60s}

# ==========================================
# Client
# ==========================================

webapp.origin=${WEBAPP_ORIGIN}


# ==========================================
# Cloudinary
# ==========================================

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.folder-path=scraply/request


# ==========================================
# Spring Session / Redis HTTP Session
# ==========================================

spring.session.store-type=redis
spring.session.redis.namespace=scraply:session
spring.session.timeout=24h

server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:Lax}
server.servlet.session.cookie.path=/
scraply.session.encryption-key=${SESSION_ENCRYPTION_KEY:scraply-super-secret-key-for-session-encryption-32bytes}

# ==========================================
# HTTP / Monitoring
# ==========================================

server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ==========================================
# Multipart upload limits
# ==========================================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ==========================================
# Image upload validation
# ==========================================

scraply.image.max-file-size=5242880
scraply.image.max-width=8000
scraply.image.max-height=8000
scraply.image.max-pixels=20000000